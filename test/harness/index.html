<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Compass Harness</title>
  <link rel="stylesheet" href="harness.css">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #fbfbfa;
      color: #182026;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .roam-body-main {
      display: flex;
      width: 100%;
      height: 100%;
    }
    .roam-main {
      flex: 1 1 auto;
      min-width: 0;
      height: 100%;
    }
    #right-sidebar {
      position: relative;
      flex: none;
      width: 0;
      height: 100%;
    }
  </style>
</head>
<body>
  <div class="roam-body-main">
    <div class="roam-main"></div>
    <div id="right-sidebar"></div>
  </div>
  <pre id="harness-result" hidden></pre>
  <script src="harness.js"></script>
</body>
</html>
